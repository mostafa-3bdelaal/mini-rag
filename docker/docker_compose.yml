services:
  mongo:
    image: mongo:7.0-jammy
    container_name: mongo

    ports:
      - "27007:27017"

    volumes:
      - mongodata:/data/db

    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}



    networks:
      - mynetwork

    restart: always

networks:
  mynetwork:

volumes:
  mongodata: